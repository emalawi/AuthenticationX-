<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emalawi19 Authentication</title>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendEmailVerification,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        /*
         * ==========================================
         * FIREBASE CONFIGURATION
         * ==========================================
         * We will replace these values with the
         * configuration from your Firebase project.
         */

        const firebaseConfig = {
  apiKey: "AIzaSyDuw3_pLPsV-qd2COG33cgSPy2gYYPX1Dg",
  authDomain: "emalawi19-pdf-hub-fed74.firebaseapp.com",
  projectId: "emalawi19-pdf-hub-fed74",
  storageBucket: "emalawi19-pdf-hub-fed74.firebasestorage.app",
  messagingSenderId: "605390304468",
  appId: "1:605390304468:web:e7171476ee953247897741"
};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const registerForm = document.getElementById("registerForm");
        const loginForm = document.getElementById("loginForm");

        const registerEmail = document.getElementById("registerEmail");
        const registerPassword = document.getElementById("registerPassword");

        const loginEmail = document.getElementById("loginEmail");
        const loginPassword = document.getElementById("loginPassword");

        const message = document.getElementById("message");

        const authSection = document.getElementById("authSection");
        const dashboard = document.getElementById("dashboard");

        const userEmail = document.getElementById("userEmail");
        const verificationStatus = document.getElementById("verificationStatus");

        const resendButton = document.getElementById("resendButton");
        const logoutButton = document.getElementById("logoutButton");

        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");

        const loginBox = document.getElementById("loginBox");
        const registerBox = document.getElementById("registerBox");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function showLogin() {
            loginTab.classList.add("active");
            registerTab.classList.remove("active");

            loginBox.classList.add("visible");
            registerBox.classList.remove("visible");

            showMessage("", "");
        }

        function showRegister() {
            registerTab.classList.add("active");
            loginTab.classList.remove("active");

            registerBox.classList.add("visible");
            loginBox.classList.remove("visible");

            showMessage("", "");
        }

        loginTab.addEventListener("click", showLogin);
        registerTab.addEventListener("click", showRegister);

        /*
         * ==========================================
         * REGISTER
         * ==========================================
         */

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = registerEmail.value.trim();
            const password = registerPassword.value;

            if (password.length < 6) {
                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );
                return;
            }

            try {
                showMessage("Creating your account...", "info");

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                await sendEmailVerification(userCredential.user);

                showMessage(
                    "Account created! Please check your email and click the verification link.",
                    "success"
                );

                registerForm.reset();

            } catch (error) {

                if (error.code === "auth/email-already-in-use") {
                    showMessage(
                        "This email is already registered.",
                        "error"
                    );
                } else if (error.code === "auth/invalid-email") {
                    showMessage(
                        "Please enter a valid email address.",
                        "error"
                    );
                } else if (error.code === "auth/weak-password") {
                    showMessage(
                        "Please choose a stronger password.",
                        "error"
                    );
                } else {
                    showMessage(
                        error.message,
                        "error"
                    );
                }
            }
        });

        /*
         * ==========================================
         * LOGIN
         * ==========================================
         */

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            try {
                showMessage("Signing you in...", "info");

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                await userCredential.user.reload();

                if (!userCredential.user.emailVerified) {
                    showMessage(
                        "Your email is not verified yet. Please check your inbox.",
                        "error"
                    );

                    await signOut(auth);
                    return;
                }

                showMessage(
                    "Login successful!",
                    "success"
                );

                loginForm.reset();

            } catch (error) {

                if (
                    error.code === "auth/invalid-credential" ||
                    error.code === "auth/wrong-password" ||
                    error.code === "auth/user-not-found"
                ) {
                    showMessage(
                        "Incorrect email or password.",
                        "error"
                    );
                } else if (error.code === "auth/invalid-email") {
                    showMessage(
                        "Please enter a valid email address.",
                        "error"
                    );
                } else {
                    showMessage(
                        error.message,
                        "error"
                    );
                }
            }
        });

        /*
         * ==========================================
         * RESEND VERIFICATION EMAIL
         * ==========================================
         */

        resendButton.addEventListener("click", async function() {

            const user = auth.currentUser;

            if (!user) {
                showMessage(
                    "Please log in first.",
                    "error"
                );
                return;
            }

            try {

                await sendEmailVerification(user);

                showMessage(
                    "A new verification email has been sent.",
                    "success"
                );

            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );
            }
        });

        /*
         * ==========================================
         * LOGOUT
         * ==========================================
         */

        logoutButton.addEventListener("click", async function() {

            try {

                await signOut(auth);

                showMessage(
                    "You have been logged out.",
                    "success"
                );

            } catch (error) {

                showMessage(
                    error.message,
                    "error"
                );
            }
        });

        /*
         * ==========================================
         * AUTH STATE
         * ==========================================
         */

        onAuthStateChanged(auth, async function(user) {

            if (!user) {

                authSection.style.display = "block";
                dashboard.style.display = "none";

                return;
            }

            await user.reload();

            if (!user.emailVerified) {

                authSection.style.display = "block";
                dashboard.style.display = "none";

                return;
            }

            authSection.style.display = "none";
            dashboard.style.display = "block";

            userEmail.textContent = user.email;

            verificationStatus.textContent =
                "✓ Email verified";

            verificationStatus.className =
                "verified";
        });
    </script>
